name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: tomek-f/action-pnpm@v1.2.0
            - run: pnpm build

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: tomek-f/action-pnpm@v1.2.0
            - run: pnpm lint

    types:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: tomek-f/action-pnpm@v1.2.0
            - run: pnpm check-types

    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: tomek-f/action-pnpm@v1.2.0
            - run: pnpm format-check

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: tomek-f/action-pnpm@v1.2.0
            - run: pnpm test-ci
            - uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: ./test-reports/junit.xml
